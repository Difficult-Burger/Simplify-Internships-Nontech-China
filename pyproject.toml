[project]
name = "nontech-jobs-china"
version = "0.1.0"
description = "中国科技公司非技术实习与校招岗位雷达"
requires-python = ">=3.12"

[dependency-groups]
dev = ["ruff>=0.14.11", "mypy>=1.19.1"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
