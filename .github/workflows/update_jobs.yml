name: Update jobs

on:
  workflow_dispatch:
  schedule:
    - cron: "20 0 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch official jobs and build artifacts
        run: python main.py fetch
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Commit changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/jobs.json data/jobs.csv data/companies.json data/job_history.json data/source_health.json docs/jobs.json docs/jobs.csv docs/companies.json docs/source_health.json
          git diff --cached --quiet || git commit -m "chore: update official job listings"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:${GITHUB_REF_NAME}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  source-health:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fail on incomplete company sources
        run: |
          python - <<'PY'
          import json
          import sys

          with open("data/source_health.json", encoding="utf-8") as file:
              health = json.load(file)
          if health["ok"]:
              print("All monitored company sources completed successfully.")
              raise SystemExit(0)
          print("Incomplete company sources:")
          for source in health["sources"]:
              if source["status"] == "failed":
                  print(f"- {source['company']}: {source['error']}")
          sys.exit(1)
          PY
