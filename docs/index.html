<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="中国科技公司非技术实习与校招岗位雷达" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%23171713'/%3E%3Ccircle cx='32' cy='32' r='10' fill='%23e9472b'/%3E%3C/svg%3E" />
    <title>非技术岗求职雷达</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="paper-noise" aria-hidden="true"></div>
    <header class="masthead">
      <a class="wordmark" href="./">NONTECH<br />RADAR</a>
      <div class="issue-line">
        <span>中国科技公司</span>
        <span>实习 · 校招</span>
        <span id="updated-at">读取数据中</span>
      </div>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">OFFICIAL SOURCES ONLY / 只看官方源</p>
        <h1>别在信息流里<br />捞工作。</h1>
        <p class="deck">把散落在企业官网的非技术岗，整理成一张每天更新、能追溯来源的清单。</p>
        <div class="hero-stat"><strong id="total-count">—</strong><span>个当前岗位</span></div>
      </section>

      <section class="filter-panel" aria-label="岗位筛选">
        <label class="search-field">
          <span>搜索</span>
          <input id="search" type="search" placeholder="岗位、公司、城市…" autocomplete="off" />
        </label>
        <label><span>职能</span><select id="category"><option value="">全部职能</option></select></label>
        <label><span>类型</span><select id="stage"><option value="">实习 + 校招</option><option>实习</option><option>校招</option></select></label>
        <label><span>城市</span><select id="city"><option value="">全部城市</option></select></label>
        <label><span>公司</span><select id="company"><option value="">全部公司</option></select></label>
        <button id="reset" type="button">清空筛选</button>
      </section>

      <section class="results-head">
        <h2>正在开放</h2>
        <p><strong id="result-count">0</strong> 条结果 · 默认按新鲜度排序</p>
      </section>
      <section id="job-list" class="job-list" aria-live="polite"></section>
      <button id="load-more" class="load-more" type="button" hidden>继续看下一批</button>
    </main>

    <footer>
      <p>岗位正文和申请状态以企业官网为准。</p>
      <a href="jobs.json">JSON</a>
      <a href="jobs.csv">CSV</a>
    </footer>
    <script src="app.js" defer></script>
  </body>
</html>
